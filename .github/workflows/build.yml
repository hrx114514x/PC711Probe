name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and run static checks
        run: ./Scripts/verify.sh
      - name: Test offline Issue 9 evidence extraction
        run: python3 -m unittest discover -s Tests -p test_issue9_extract.py -v
      - name: Build and inspect Issue 9 read-only diagnostic
        run: sh Diagnostics/verify-macos.sh
      - name: Upload review-only diagnostic and verification records
        uses: actions/upload-artifact@v4
        with:
          name: issue9-review-only-${{ github.sha }}
          path: |
            build/Issue9Review/PM9C1aReadOnly.kext
            build/Issue9Review/undefined-symbols.txt
            build/Issue9Review/REVIEW_ONLY.txt
            docs/ISSUE9_REVIEW.md
          if-no-files-found: error
